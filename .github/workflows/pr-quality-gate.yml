name: PR Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Build and Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simprok_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build backend
        run: npm run build
      - name: Run backend unit tests serially
        run: npm test -- --runInBand
      - name: Run production Owner bootstrap focused tests
        run: npm run test:bootstrap-owner

  frontend-quality:
    name: Frontend Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  official-safe-e2e:
    name: Official Safe E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simprok_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simprok_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://simprok_e2e_app:simprok-e2e-app-ci-only@localhost:5432/simprok_e2e?schema=public
      JWT_SECRET: ci-only-simprok-test-secret
      # GHX-01 signs its decision context with a DEDICATED key and deliberately
      # has NO fallback to the access-token secret, so it must be supplied
      # separately and must differ from JWT_SECRET. CI-only value.
      GHX_DECISION_CONTEXT_SECRET: ci-only-simprok-ghx-decision-context-secret
      SIMPROK_E2E_DESTRUCTIVE_CAPABILITY: RESET_SIMPROK_E2E_DATABASE
      INTAKE_WORKER_ENABLED: 'false'
      INTAKE_UNDERSTANDING_WORKER_ENABLED: 'false'
      INTAKE_PUBLICATION_WORKER_ENABLED: 'false'
      INTAKE_BUSINESS_SUBSCRIPTION_WORKER_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Provision restricted E2E runtime database role
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          const adminUrl =
            'postgresql://postgres:postgres@localhost:5432/postgres';

          const runtimeUrl =
            'postgresql://simprok_e2e_app:simprok-e2e-app-ci-only@localhost:5432/simprok_e2e';

          async function main() {
            const admin = new Client({
              connectionString: adminUrl,
            });

            await admin.connect();

            try {
              await admin.query(`
                CREATE ROLE simprok_e2e_app
                  LOGIN
                  PASSWORD 'simprok-e2e-app-ci-only'
                  NOSUPERUSER
                  NOCREATEROLE
                  NOCREATEDB
                  NOREPLICATION
                  NOBYPASSRLS
              `);

              await admin.query(`
                ALTER DATABASE simprok_e2e
                OWNER TO simprok_e2e_app
              `);
            } finally {
              await admin.end();
            }

            const runtime = new Client({
              connectionString: runtimeUrl,
            });

            await runtime.connect();

            try {
              const result = await runtime.query(`
                SELECT
                  current_user,
                  current_database(),
                  rolsuper,
                  rolcreaterole,
                  has_database_privilege(
                    current_user,
                    current_database(),
                    'CREATE'
                  ) AS can_create
                FROM pg_roles
                WHERE rolname = current_user
              `);

              const row = result.rows[0];

              console.log({
                current_user: row.current_user,
                current_database: row.current_database,
                rolsuper: row.rolsuper,
                rolcreaterole: row.rolcreaterole,
                can_create: row.can_create,
              });

              if (
                row.current_user !== 'simprok_e2e_app' ||
                row.current_database !== 'simprok_e2e' ||
                row.rolsuper !== false ||
                row.rolcreaterole !== false ||
                row.can_create !== true
              ) {
                throw new Error(
                  'E2E_RUNTIME_ROLE_CONTRACT_NOT_PROVEN',
                );
              }
            } finally {
              await runtime.end();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Create isolated test environment
        run: |
          {
            echo 'NODE_ENV=test'
            echo 'DATABASE_URL=postgresql://simprok_e2e_app:simprok-e2e-app-ci-only@localhost:5432/simprok_e2e?schema=public'
            echo 'JWT_SECRET=ci-only-simprok-test-secret'
            echo 'GHX_DECISION_CONTEXT_SECRET=ci-only-simprok-ghx-decision-context-secret'
            echo 'SIMPROK_E2E_DESTRUCTIVE_CAPABILITY=RESET_SIMPROK_E2E_DATABASE'
            echo 'INTAKE_WORKER_ENABLED=false'
            echo 'INTAKE_UNDERSTANDING_WORKER_ENABLED=false'
            echo 'INTAKE_PUBLICATION_WORKER_ENABLED=false'
            echo 'INTAKE_BUSINESS_SUBSCRIPTION_WORKER_ENABLED=false'
          } > .env.e2e
      - name: Verify isolated test database
        run: npm run verify:db:e2e
      - name: Run official safe E2E lifecycle
        run: npm run test:e2e
